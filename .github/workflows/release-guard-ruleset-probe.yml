name: Release guard ruleset probe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Ephemeral tag to create
        required: true
        type: string
      sha:
        description: Commit to tag
        required: true
        type: string
      status_state:
        description: Required status to publish before creating the tag
        required: true
        type: choice
        options:
          - none
          - failure
          - success
      expected_outcome:
        description: Expected ruleset decision
        required: true
        type: choice
        options:
          - blocked
          - accepted

permissions:
  contents: write
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise tag ruleset with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          STATUS_STATE: ${{ inputs.status_state }}
          TAG: ${{ inputs.tag }}
          EXPECTED_OUTCOME: ${{ inputs.expected_outcome }}
          STATUS_CONTEXT: release-guard/probe-20260818
        run: |
          set -uo pipefail

          echo "run=$GITHUB_RUN_ID triggering_actor=$GITHUB_TRIGGERING_ACTOR github_actor=$GITHUB_ACTOR"
          echo "credential=github.token sha=$SHA tag=$TAG status=$STATUS_STATE expected=$EXPECTED_OUTCOME"

          if [ "$STATUS_STATE" != "none" ]; then
            gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f state="$STATUS_STATE" \
              -f context="$STATUS_CONTEXT" \
              -f description="Ephemeral ruleset probe via GITHUB_TOKEN"
          fi

          set +e
          tag_response=$(gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA" 2>&1)
          tag_exit=$?
          set -e

          echo "tag_api_exit=$tag_exit"
          printf '%s\n' "$tag_response"

          if [ "$EXPECTED_OUTCOME" = "blocked" ]; then
            test "$tag_exit" -ne 0
          else
            test "$tag_exit" -eq 0
          fi
